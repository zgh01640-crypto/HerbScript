services:
  mysql:
    image: mysql:8.4
    container_name: herbscript-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - herbscript-prod-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: herbscript-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_CORS_ALLOWED_ORIGINS: ${SPRING_CORS_ALLOWED_ORIGINS}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY}
      DOUBAO_BASE_URL: ${DOUBAO_BASE_URL}
      DOUBAO_MODEL: ${DOUBAO_MODEL}
      DOUBAO_CHAT_PATH: ${DOUBAO_CHAT_PATH}
      DOUBAO_FALLBACK_TO_MOCK_ON_ERROR: ${DOUBAO_FALLBACK_TO_MOCK_ON_ERROR}
    expose:
      - "8081"
    volumes:
      - ./storage/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: herbscript-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"

volumes:
  herbscript-prod-mysql-data:
